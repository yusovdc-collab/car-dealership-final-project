name: Django CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Django
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django project
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python linter
        run: pip install flake8

      - name: Lint Python Files
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JavaScript linter
        run: npm install --no-save eslint@8.57.1

      - name: Lint JavaScript Files
        shell: bash
        run: |
          mapfile -d '' files < <(
            find server -type f \
              \( -name '*.js' -o -name '*.jsx' \) \
              -not -path '*/node_modules/*' \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 1
          fi

          npx eslint \
            --no-eslintrc \
            --env browser,node,es2021 \
            --parser-options '{"ecmaVersion":2021,"sourceType":"module","ecmaFeatures":{"jsx":true}}' \
            --rule 'no-undef: off' \
            --rule 'no-unused-vars: warn' \
            "${files[@]}"
