name: Django CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test Django
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Django project
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test

  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python linter
        run: python -m pip install flake8

      - name: Lint Python Files
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv,.venv
          echo "Python lint completed successfully"

  lint_javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JavaScript linter
        run: npm install --no-save eslint@8

      - name: Lint JavaScript Files
        run: |
          find server -type f -name "*.js" -not -path "*/node_modules/*" -print
          npx eslint server --no-eslintrc --env browser,es2021,node --parser-options '{"ecmaVersion":2021,"sourceType":"module"}' --rule 'no-undef:error' --rule 'no-unused-vars:warn' --ext .js
          echo "JavaScript lint completed successfully"
