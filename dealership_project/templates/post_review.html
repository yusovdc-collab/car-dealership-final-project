<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Review - Car Dealership Reviews</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #19375d;
            color: white;
            padding: 20px 25px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
        }

        nav {
            background: #102744;
            padding: 12px 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 2px 6px #00000015;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .button {
            display: inline-block;
            background: #1769aa;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
        }

        .button:hover {
            background: #125487;
        }

        .back {
            background: #555;
            margin-left: 8px;
        }

        .error {
            color: #b00020;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>Car Dealership Reviews</h1>
    <p>Find dealerships and explore customer reviews</p>
</header>

<nav>
    <a href="/">Home</a>
</nav>

<div class="container">

    <div class="card">

        <h2>Post Review</h2>

        <p>
            Dealership:
            <strong>{{ dealer.full_name }}</strong>
        </p>

        <p>
            Location:
            {{ dealer.city }}, {{ dealer.state }}
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ user.username }}"
                required
            >

            <label for="review">Your Review</label>
            <textarea
                id="review"
                name="review"
                placeholder="Write your dealership review..."
                required
            ></textarea>

            <label for="purchase">
                Did you purchase a vehicle?
            </label>

            <select
                id="purchase"
                name="purchase"
                required
            >
                <option value="">Select an option</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label for="car_make">Car Make</label>

            <select id="car_make" name="car_make">
                <option value="">Select Car Make</option>
                <option value="Toyota">Toyota</option>
                <option value="Honda">Honda</option>
                <option value="BMW">BMW</option>
                <option value="Ford">Ford</option>
            </select>

            <label for="car_model">Car Model</label>

            <input
                type="text"
                id="car_model"
                name="car_model"
                placeholder="Enter car model"
            >

            <label for="car_year">Car Year</label>

            <input
                type="number"
                id="car_year"
                name="car_year"
                min="1900"
                max="2100"
                placeholder="Enter car year"
            >

            <button class="button" type="submit">
                Submit Review
            </button>

            <a
                class="button back"
                href="{% url 'dealer_details' dealer.id %}"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
