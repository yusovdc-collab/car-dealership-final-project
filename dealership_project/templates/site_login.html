<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car Dealership Reviews</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
        }

        header {
            background: #1b395f;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 10px #0002;
        }

        h2 {
            text-align: center;
            color: #1b395f;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1b395f;
            color: white;
            border: none;
            border-radius: 4px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #28517f;
        }

        .error {
            color: red;
            text-align: center;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <a href="{% url 'home' %}">
        Car Dealership Reviews
    </a>
</header>

<div class="login-container">

    <h2>Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{% url 'site_login' %}">

        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next }}">

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="back">
        <a href="{% url 'home' %}">
            Back to Dealerships
        </a>
    </div>

</div>

</body>
</html>
